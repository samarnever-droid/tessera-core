[workspace]
members = [
    "crates/axiom-core",
    "crates/axiom-model",
    "crates/axiom-train",
    "crates/axiom-infer",
    "crates/axiom-baseline",
    "crates/axiom-bench",
    "crates/stratum-core",
    "crates/forge-core",
    "crates/mneme-core",
    "crates/tessera-core",
    "crates/meridian-core",
    "crates/meridian-server",
    "crates/meridian-proto",
    "crates/meridian-bounded",
    "crates/meridian-sim",
    "crates/meridian-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
