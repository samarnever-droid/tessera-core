[package]
name = "stratum-core"
version = "0.1.0"
edition = "2021"
description = "STRATUM CPU-primary language model architecture with Product-Key Sparse Memory and Delta-Rule recurrence"

[dependencies]
axiom-core = { path = "../axiom-core" }
axiom-baseline = { path = "../axiom-baseline" }
axiom-train = { path = "../axiom-train" }
rand = "0.8"
rayon = "1.10"
sysinfo = "0.30"

[[bin]]
name = "stratum-f4"
path = "src/bin/f4_runner.rs"
